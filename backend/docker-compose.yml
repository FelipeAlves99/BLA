services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bla
      POSTGRES_USER: bla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bla"]
      interval: 5s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in backend/.env}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
    ports: ["8080:8080"]
    volumes: ["./keycloak/import:/opt/keycloak/data/import:ro"]
volumes:
  postgres_data:
